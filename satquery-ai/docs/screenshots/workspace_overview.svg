  <!-- Shelf Tab Bar -->
  <rect x="260" y="520" width="700" height="32" fill="#090e0b" stroke="#16221a" stroke-width="1" />
  <rect x="270" y="525" width="85" height="22" rx="2" fill="#0c1811" stroke="#00ff87" stroke-width="1" />
