<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#030504;font-family:'JetBrains Mono',monospace;">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0c120e" />
      <stop offset="100%" stop-color="#030504" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#00b85a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  <!-- Grid overlay -->
  <g stroke="#0f1912" stroke-width="1" opacity="0.6">
    <line x1="0" y1="48" x2="1280" y2="48" />
    <line x1="260" y1="48" x2="260" y2="720" />
    <line x1="960" y1="48" x2="960" y2="720" />
    <line x1="260" y1="520" x2="960" y2="520" />
  </g>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1280" height="48" fill="#070a08" stroke="#16221a" stroke-width="1" />
  <circle cx="24" cy="24" r="6" fill="#00ff87" filter="url(#glow)" />
  <text x="38" y="29" fill="#00ff87" font-weight="bold" font-size="16" letter-spacing="2">SATQUERY AI</text>
  <text x="175" y="28" fill="#607b6d" font-size="11">| REMOTE SENSING INTELLIGENCE WORKSTATION</text>
  <text x="500" y="28" fill="#a4c2b2" font-size="12" letter-spacing="1">ISRO — SMART INDIA HACKATHON 2026 (PS: 26167)</text>
  <rect x="1080" y="14" width="80" height="20" rx="2" fill="#0c1811" stroke="#00ff87" stroke-width="1" />
  <text x="1090" y="28" fill="#00ff87" font-size="10" font-weight="bold">GPU READY</text>
  <rect x="1170" y="14" width="90" height="20" rx="2" fill="#0c1811" stroke="#1c2d22" stroke-width="1" />
  <text x="1182" y="28" fill="#849b8d" font-size="10">SYS: NOMINAL</text>

  <!-- LEFT PANEL: Inputs & Mode Selector -->
  <rect x="0" y="48" width="260" height="672" fill="#050806" stroke="#16221a" stroke-width="1" />
  <text x="16" y="76" fill="#849b8d" font-size="11" font-weight="bold" letter-spacing="1">MISSION MODE</text>
  
  <rect x="16" y="90" width="228" height="28" rx="2" fill="#0c1811" stroke="#00ff87" stroke-width="1" />
  <text x="28" y="108" fill="#00ff87" font-size="11" font-weight="bold">● SINGLE IMAGE (VQA)</text>
  
  <rect x="16" y="126" width="228" height="28" rx="2" fill="#080c0a" stroke="#16221a" stroke-width="1" />
  <text x="28" y="144" fill="#607b6d" font-size="11">○ BI-TEMPORAL CHANGE</text>

  <rect x="16" y="162" width="228" height="28" rx="2" fill="#080c0a" stroke="#16221a" stroke-width="1" />
  <text x="28" y="180" fill="#607b6d" font-size="11">○ OPTICAL + SAR FUSION</text>

  <text x="16" y="222" fill="#849b8d" font-size="11" font-weight="bold" letter-spacing="1">ISRO DEMO PRESETS</text>
  <rect x="16" y="234" width="228" height="34" rx="2" fill="#0c120e" stroke="#16221a" />
  <text x="26" y="255" fill="#a4c2b2" font-size="11">Optical Scene: River &amp; Port</text>
  <rect x="16" y="276" width="228" height="34" rx="2" fill="#0c120e" stroke="#16221a" />
  <text x="26" y="297" fill="#a4c2b2" font-size="11">SAR Sentinel-1: Urban Flood</text>
  <rect x="16" y="318" width="228" height="34" rx="2" fill="#0c120e" stroke="#16221a" />
  <text x="26" y="339" fill="#a4c2b2" font-size="11">Bi-Temporal: Urban Expansion</text>

  <text x="16" y="388" fill="#849b8d" font-size="11" font-weight="bold" letter-spacing="1">ACTIVE TELEMETRY</text>
  <rect x="16" y="400" width="228" height="110" rx="2" fill="#070c09" stroke="#16221a" />
  <text x="26" y="422" fill="#607b6d" font-size="10">CRS: EPSG:4326 (WGS-84)</text>
  <text x="26" y="442" fill="#607b6d" font-size="10">RES: 0.5m GSD | 256x256 px</text>
  <text x="26" y="462" fill="#607b6d" font-size="10">BANDS: 3 (Red, Green, Blue)</text>
  <text x="26" y="482" fill="#607b6d" font-size="10">ORBIT: Cartosat-2C Sun-Sync</text>
  <text x="26" y="502" fill="#00ff87" font-size="10">VALIDATION: PASS (100%)</text>

  <!-- CENTER PANEL: Hero Imagery Viewport (70% HERO) -->
  <rect x="260" y="48" width="700" height="472" fill="#040605" />
  
  <!-- Simulated Satellite Image -->
  <g transform="translate(380, 80)">
    <!-- Earth Observation Surface simulation -->
    <rect width="460" height="380" rx="2" fill="#12251a" stroke="#1b3827" stroke-width="2" />
    <path d="M 40 380 Q 120 200 220 180 T 460 120 L 460 380 Z" fill="#0c1c2e" />
    <path d="M 0 100 Q 140 80 200 120 T 400 60 L 460 0 L 0 0 Z" fill="#1d3822" />
    <!-- Urban / Built-up grid -->
    <g fill="#424c45" stroke="#2b332e" stroke-width="1">
      <rect x="260" y="190" width="40" height="30" />
      <rect x="310" y="180" width="45" height="35" />
      <rect x="280" y="230" width="50" height="40" />
      <rect x="340" y="225" width="35" height="45" />
    </g>

    <!-- Grounded Evidence Box (Water Body) -->
    <rect x="180" y="240" width="160" height="90" fill="rgba(0,255,135,0.15)" stroke="#00ff87" stroke-width="2" stroke-dasharray="6 3" />
    <rect x="180" y="220" width="130" height="20" fill="#070a08" stroke="#00ff87" stroke-width="1" />
    <text x="186" y="234" fill="#00ff87" font-size="10" font-weight="bold">Water body (92%)</text>

    <!-- Reticle corner brackets -->
    <path d="M 174 250 L 174 234 L 190 234" stroke="#00ff87" stroke-width="2" fill="none" />
    <path d="M 346 320 L 346 336 L 330 336" stroke="#00ff87" stroke-width="2" fill="none" />

    <!-- Center Crosshairs -->
    <line x1="225" y1="210" x2="235" y2="210" stroke="#00ff87" stroke-width="1" />
    <line x1="230" y1="205" x2="230" y2="215" stroke="#00ff87" stroke-width="1" />
  </g>

  <!-- Viewport HUD Overlay -->
