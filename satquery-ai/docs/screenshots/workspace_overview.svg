    <text x="12" y="80" fill="#607b6d" font-size="9">CLASSIFICATION: DENSE CANOPY</text>
    <text x="12" y="100" fill="#00ff87" font-size="9">SPECTRAL CONF: 94%</text>

    <!-- NDWI Card -->
    <rect x="220" y="0" width="200" height="120" rx="2" fill="#0a100c" stroke="#16221a" />
    <text x="232" y="24" fill="#00e5ff" font-size="11" font-weight="bold">NDWI (Water Body)</text>
    <text x="370" y="24" fill="#fff" font-size="11" font-weight="bold">+0.38</text>
    <rect x="232" y="34" width="176" height="8" rx="2" fill="#132018" />
    <rect x="232" y="34" width="140" height="8" rx="2" fill="#00e5ff" />
    <text x="232" y="60" fill="#607b6d" font-size="9">MIN: -0.45 | MAX: +0.65</text>
    <text x="232" y="80" fill="#607b6d" font-size="9">FEATURE: OPEN WATER SURFACE</text>
    <text x="232" y="100" fill="#00e5ff" font-size="9">DELINEATED: 14.8 HECTARES</text>

    <!-- Co-Registration Card -->
    <rect x="440" y="0" width="200" height="120" rx="2" fill="#0a100c" stroke="#16221a" />
    <text x="452" y="24" fill="#ffaa00" font-size="11" font-weight="bold">Cross-Modal Corroboration</text>
    <text x="590" y="24" fill="#fff" font-size="11" font-weight="bold">88%</text>
    <rect x="452" y="34" width="176" height="8" rx="2" fill="#132018" />
    <rect x="452" y="34" width="155" height="8" rx="2" fill="#ffaa00" />
    <text x="452" y="60" fill="#607b6d" font-size="9">OPTICAL NDWI: +0.38 (WATER)</text>
    <text x="452" y="80" fill="#607b6d" font-size="9">SAR BACKSCATTER: -21 dB (SPECULAR)</text>
    <text x="452" y="100" fill="#00ff87" font-size="9">AGREEMENT: PERFECT CORROBORATION</text>
  </g>

  <!-- RIGHT PANEL: Query & Intelligence Briefing -->
  <rect x="960" y="48" width="320" height="672" fill="#070a08" stroke="#16221a" stroke-width="1" />
  
  <text x="976" y="76" fill="#849b8d" font-size="11" font-weight="bold" letter-spacing="1">NATURAL LANGUAGE QUERY</text>
  <rect x="976" y="88" width="288" height="60" rx="2" fill="#040605" stroke="#16221a" />
  <text x="986" y="110" fill="#e2f0e8" font-size="11">"Identify water bodies and calculate</text>
  <text x="986" y="128" fill="#e2f0e8" font-size="11">vegetation index across the sector."</text>

  <rect x="976" y="156" width="288" height="28" rx="2" fill="#0c1811" stroke="#00ff87" stroke-width="1" />
  <text x="1055" y="174" fill="#00ff87" font-size="11" font-weight="bold">⚡ DISPATCH ORCHESTRATOR</text>

  <!-- Intelligence Briefing Box -->
  <rect x="976" y="200" width="288" height="500" rx="2" fill="#050806" stroke="#16221a" />
  <rect x="976" y="200" width="288" height="26" fill="#0a120d" stroke="#16221a" />
  <circle cx="990" cy="213" r="3" fill="#00ff87" />
  <text x="1000" y="217" fill="#00ff87" font-size="10" font-weight="bold">INTELLIGENCE BRIEFING</text>
  <text x="1200" y="217" fill="#607b6d" font-size="9">RUN #8F3A10</text>

  <text x="990" y="250" fill="#ffffff" font-size="12" font-weight="bold">Water Body Verified in Southeast</text>
  <text x="990" y="270" fill="#a4c2b2" font-size="10">High-confidence detection of an active</text>
  <text x="990" y="286" fill="#a4c2b2" font-size="10">reservoir with mean NDWI +0.38 and</text>
  <text x="990" y="302" fill="#a4c2b2" font-size="10">healthy riparian canopy (NDVI 0.62).</text>

  <!-- Confidence Rating Meter -->
  <g transform="translate(990, 325)">
    <rect x="0" y="0" width="260" height="54" rx="2" fill="#0c140f" stroke="#16221a" />
    <text x="10" y="18" fill="#849b8d" font-size="9" font-weight="bold">CALIBRATED CONFIDENCE</text>
    <text x="10" y="42" fill="#00ff87" font-size="20" font-weight="bold">88%</text>
    <text x="60" y="38" fill="#00ff87" font-size="9" font-weight="bold">HIGH CONFIDENCE</text>
    <rect x="150" y="28" width="100" height="6" rx="2" fill="#132018" />
    <rect x="150" y="28" width="88" height="6" rx="2" fill="#00ff87" />
  </g>

  <!-- Evidence List -->
  <text x="990" y="405" fill="#849b8d" font-size="10" font-weight="bold">VERIFIED SPATIAL EVIDENCE (3)</text>
  
  <rect x="990" y="415" width="260" height="50" rx="2" fill="#0c140f" stroke="#16221a" />
  <text x="998" y="432" fill="#e2f0e8" font-size="10">Open water body in sector SE</text>
  <text x="998" y="452" fill="#00ff87" font-size="9">NDWI + SAR Specular (94% conf)</text>

  <rect x="990" y="473" width="260" height="50" rx="2" fill="#0c140f" stroke="#16221a" />
  <text x="998" y="490" fill="#e2f0e8" font-size="10">Dense vegetation belt adjacent</text>
  <text x="998" y="510" fill="#00ff87" font-size="9">NDVI 0.62 Canopy (86% conf)</text>

  <rect x="990" y="531" width="260" height="50" rx="2" fill="#0c140f" stroke="#16221a" />
  <text x="998" y="548" fill="#e2f0e8" font-size="10">Urban structures in northwest</text>
  <text x="998" y="568" fill="#00ff87" font-size="9">Double-bounce SAR + NDBI (82%)</text>

  <!-- Export Buttons -->
  <rect x="990" y="640" width="125" height="28" rx="2" fill="#0a140e" stroke="#00ff87" stroke-width="1" />
  <text x="1005" y="658" fill="#00ff87" font-size="9" font-weight="bold">EXPORT REPORT (HTML)</text>

  <rect x="1125" y="640" width="125" height="28" rx="2" fill="#0a140e" stroke="#1c2e22" />
  <text x="1145" y="658" fill="#849b8d" font-size="9">AUDIT LOG (JSON)</text>
</svg>
