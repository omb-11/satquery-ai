  <text x="375" y="540" fill="#849b8d" font-size="10">SPECTRAL</text>
  <text x="450" y="540" fill="#849b8d" font-size="10">TEMPORAL</text>
  <text x="530" y="540" fill="#849b8d" font-size="10">SAR / FUSION</text>
  <text x="630" y="540" fill="#849b8d" font-size="10">EVIDENCE (3)</text>
  <text x="730" y="540" fill="#849b8d" font-size="10">TRACE (6)</text>

